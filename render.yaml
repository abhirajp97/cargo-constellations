services:
  - type: web
    name: cargo-constellations-ais-relay
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: AISSTREAM_API_KEY
        sync: false
      - key: GFW_API_TOKEN
        sync: false
      - key: AIS_FULL_GLOBE
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://cargo-constellations.sanoja2000.chatgpt.site
